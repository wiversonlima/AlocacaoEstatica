# Configuração Apache otimizada para WordPress em tablet Android
# Arquivo: httpd.conf

# Configurações básicas do servidor
ServerRoot /data/data/com.termux/files/usr
Listen 8080
ServerName localhost:8080

# Módulos necessários
LoadModule dir_module lib/apache2/modules/mod_dir.so
LoadModule mime_module lib/apache2/modules/mod_mime.so
LoadModule rewrite_module lib/apache2/modules/mod_rewrite.so
LoadModule php_module lib/php/modules/libphp.so

# Suporte PHP
AddHandler php-script .php
AddType application/x-httpd-php .php

# Diretório raiz do site
DocumentRoot /data/data/com.termux/files/usr/share/apache2/default-site/htdocs

# Páginas padrão
DirectoryIndex index.php index.html

# Configurações de diretório para WordPress
<Directory "/data/data/com.termux/files/usr/share/apache2/default-site/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    
    # Configurações específicas para WordPress
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </IfModule>
</Directory>

# Tipos MIME
<IfModule mod_mime.c>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
    AddType text/html .shtml
    AddOutputFilter INCLUDES .shtml
</IfModule>

# Configurações de performance para tablet
<IfModule mod_php.c>
    # Limites de memória otimizados para Android
    php_value memory_limit 128M
    php_value max_execution_time 60
    php_value max_input_time 60
    php_value post_max_size 32M
    php_value upload_max_filesize 32M
    php_value max_file_uploads 20
    
    # Configurações de sessão
    php_value session.gc_maxlifetime 1440
    php_value session.save_path "/data/data/com.termux/files/usr/tmp"
    
    # Desabilitar funções desnecessárias
    php_value disable_functions "exec,passthru,shell_exec,system,proc_open,popen"
    
    # Configurações de erro (desenvolvimento)
    php_value display_errors Off
    php_value log_errors On
    php_value error_log "/data/data/com.termux/files/usr/var/log/apache2/php_errors.log"
</IfModule>

# Configurações de logging
ErrorLog /data/data/com.termux/files/usr/var/log/apache2/error_log
CustomLog /data/data/com.termux/files/usr/var/log/apache2/access_log combined
LogLevel warn

# Arquivo PID
PidFile /data/data/com.termux/files/usr/tmp/httpd.pid

# Configurações de processo
StartServers 1
MinSpareServers 1
MaxSpareServers 3
MaxRequestWorkers 8
ThreadsPerChild 25

# Timeout configurações
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Configurações de segurança
ServerTokens Prod
ServerSignature Off

# Prevenir acesso a arquivos de configuração
<Files ~ "^\.">
    Require all denied
</Files>

<Files "wp-config.php">
    Require all denied
</Files>

<Files "*.log">
    Require all denied
</Files>

# Configurações específicas para WordPress
<LocationMatch "^/(wp-admin|wp-includes)/">
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
    </IfModule>
</LocationMatch>

# Compressão para economizar largura de banda
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/plain
    AddOutputFilterByType DEFLATE text/html
    AddOutputFilterByType DEFLATE text/xml
    AddOutputFilterByType DEFLATE text/css
    AddOutputFilterByType DEFLATE application/xml
    AddOutputFilterByType DEFLATE application/xhtml+xml
    AddOutputFilterByType DEFLATE application/rss+xml
    AddOutputFilterByType DEFLATE application/javascript
    AddOutputFilterByType DEFLATE application/x-javascript
</IfModule>

# Cache para arquivos estáticos
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpg "access plus 1 month"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/gif "access plus 1 month"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/pdf "access plus 1 month"
    ExpiresByType text/javascript "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    ExpiresByType application/x-javascript "access plus 1 month"
    ExpiresByType application/x-shockwave-flash "access plus 1 month"
    ExpiresByType image/x-icon "access plus 1 year"
    ExpiresDefault "access plus 2 days"
</IfModule>